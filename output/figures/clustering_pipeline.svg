<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentAmber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <linearGradient id="accentBlue" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="accentGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <filter id="dropGlow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="340" rx="16" fill="url(#bgGrad2)" stroke="#334155" stroke-width="1.5" />

  <!-- Title Badge -->
  <g transform="translate(32, 28)">
    <rect x="0" y="0" width="160" height="24" rx="12" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1" />
    <text x="80" y="16" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="1">SUB-PROJECT 2</text>
    <text x="175" y="17" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">Bulky-Delivery Spatial Clustering &amp; GNN Routing</text>
  </g>

  <!-- Stage 1: Data & Constraints -->
  <g transform="translate(32, 75)" filter="url(#dropGlow2)">
    <rect width="260" height="230" rx="12" fill="url(#cardGrad2)" stroke="#334155" stroke-width="1.5" />
    <rect x="0" y="0" width="260" height="6" rx="3" fill="url(#accentAmber)" />
    <text x="20" y="32" fill="#fbbf24" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="0.5">INPUTS &amp; ROAD MATRIX</text>
    <text x="20" y="56" fill="#f1f5f9" font-family="sans-serif" font-size="16" font-weight="700">Stop Data &amp; OSRM</text>
    <text x="20" y="78" fill="#94a3b8" font-family="sans-serif" font-size="12">97 real nationwide dispatch jobs</text>
    <text x="20" y="96" fill="#94a3b8" font-family="sans-serif" font-size="12">OSRM exact driving km / hours</text>

    <!-- Sub-box -->
    <rect x="18" y="120" width="224" height="85" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="30" y="142" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">Hard Constraints</text>
    <text x="30" y="162" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Max 5 stops per cluster</text>
    <text x="30" y="180" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Volume ≤ Truck Cap (1t / 1.4t)</text>
    <text x="30" y="196" fill="#f87171" font-family="sans-serif" font-size="10">• Radius ≤ 50 km binding</text>
  </g>

  <!-- Arrow 1 -->
  <g transform="translate(305, 180)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round" />
    <polygon points="30,-5 40,0 30,5" fill="#f59e0b" />
    <text x="20" y="-12" fill="#fbbf24" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">Distance</text>
  </g>

  <!-- Stage 2: Solvers -->
  <g transform="translate(355, 75)" filter="url(#dropGlow2)">
    <rect width="260" height="230" rx="12" fill="url(#cardGrad2)" stroke="#334155" stroke-width="1.5" />
    <rect x="0" y="0" width="260" height="6" rx="3" fill="url(#accentBlue)" />
    <text x="20" y="32" fill="#60a5fa" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="0.5">SOLVER PIPELINE</text>
    <text x="20" y="56" fill="#f1f5f9" font-family="sans-serif" font-size="16" font-weight="700">Optimization Engines</text>
    <text x="20" y="78" fill="#94a3b8" font-family="sans-serif" font-size="12">Multi-method benchmark</text>
    <text x="20" y="96" fill="#94a3b8" font-family="sans-serif" font-size="12">Exact vs Heuristic vs Learning</text>

    <!-- Sub-box -->
    <rect x="18" y="120" width="224" height="85" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="30" y="142" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">Model Variants</text>
    <text x="30" y="162" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Exact Set Partitioning (MIP)</text>
    <text x="30" y="180" fill="#cbd5e1" font-family="sans-serif" font-size="11">• Column Generation (CG)</text>
    <text x="30" y="196" fill="#60a5fa" font-family="sans-serif" font-size="10">• GNN Cluster + TSP Route</text>
  </g>

  <!-- Arrow 2 -->
  <g transform="translate(628, 180)">
    <line x1="0" y1="0" x2="30" y2="0" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" />
    <polygon points="30,-5 40,0 30,5" fill="#3b82f6" />
    <text x="20" y="-12" fill="#60a5fa" font-family="sans-serif" font-size="10" font-weight="600" text-anchor="middle">Routes</text>
  </g>

  <!-- Stage 3: Operational Plans -->
  <g transform="translate(678, 75)" filter="url(#dropGlow2)">
    <rect width="250" height="230" rx="12" fill="url(#cardGrad2)" stroke="#334155" stroke-width="1.5" />
    <rect x="0" y="0" width="250" height="6" rx="3" fill="url(#accentGreen)" />
    <text x="20" y="32" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="700" letter-spacing="0.5">DISPATCH EVALUATION</text>
    <text x="20" y="56" fill="#f1f5f9" font-family="sans-serif" font-size="16" font-weight="700">Operational Results</text>
    <text x="20" y="78" fill="#94a3b8" font-family="sans-serif" font-size="12">vs Real Human Dispatch</text>
    <text x="20" y="96" fill="#94a3b8" font-family="sans-serif" font-size="12">Validated on 84 delivery days</text>

    <!-- Sub-box -->
    <rect x="18" y="120" width="214" height="85" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="30" y="142" fill="#e2e8f0" font-family="sans-serif" font-size="12" font-weight="600">Key Outcomes</text>
    <text x="30" y="162" fill="#34d399" font-family="sans-serif" font-size="11">• Truck fleet count reduced</text>
    <text x="30" y="180" fill="#34d399" font-family="sans-serif" font-size="11">• Total driving km minimized</text>
    <text x="30" y="196" fill="#2dd4bf" font-family="sans-serif" font-size="10">Zero constraint violations</text>
  </g>
</svg>
